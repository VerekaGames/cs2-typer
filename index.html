<!--
  BIAŁO-CZERWONI · typer CS2 · makieta hi-fi v7 (fonty: Saira Semi Condensed + Geist)

  SKIPER UI
    Makieta jest jednym plikiem HTML bez dostępu do rejestru shadcn, więc komponenty są napisane ręcznie na Framer Motion.
    Przy wpinaniu w docelowy projekt podmień je na oryginały:
      - Tabs (wskaźnik z layoutId)   -> Expanded Tabs:  npx shadcn@latest add "http://skiper-ui.com/registry/expanded-tabs.json"
      - CommandPalette (Ctrl/⌘ + K)  -> shadcn Command w Dialog:  npx shadcn@latest add command dialog
      - LoginModal                    -> shadcn Dialog:  npx shadcn@latest add dialog
      - pozostałe                     -> wzorzec:  npx shadcn add @skiper-ui/skiperNN  (numery dobierz w katalogu Skiper UI)

  NOWOŚCI W v6
    - paleta CS2: baza #09090B, złoto #DE9B35 (akcent), cyjan CT #4CC2FF, czerwień T #F0683C; HLTV niebieski, ARRMY żółty
    - kafelek veto (ban / pick / decider), przed meczem jako prognoza; symulacja gra mapy zgodnie z veto
    - kafelek formy składu: 5 ról na drużynę z ratingiem (zielony od 1.05, czerwony poniżej 0.97)
    - oś rund w kolorach stron: cyjan = runda wygrana jako CT, czerwień = jako T
    - statusy LIVE / UPCOMING / FINISHED z diodami
    - lista: filtr map (odznaki puli), sortowanie (czas / wyrównane / faworyt), szybki podgląd H2H w klikniętym wierszu,
      podświetlenie wiersza w kolorach obu drużyn
    - odznaki map mają własny kolor (fallback do ikon z /api/map)
    Pula map (POOL) to jedna stała na górze skryptu; docelowo ma przychodzić z API.

  FONTY (wszystkie wbudowane jako @font-face z data URI, bez zależności od sieci)
    --display  Saira Semi Condensed 600/700 (z Fontsource, z polskimi znakami): nagłówki, nazwy drużyn, wyniki, statusy, mapy
    --sans     Geist: cały tekst interfejsu i etykiety (zwykłe litery, bez wersalików)
    --num      Geist Mono: tylko kursy, statystyki, punkty i tabele
    Next.js:   npm i geist; Saira przez next/font/google:
               import { Saira_Semi_Condensed } from "next/font/google";
               const display = Saira_Semi_Condensed({ subsets:["latin","latin-ext"], weight:["600","700"], variable:"--font-display" });
  v7: etykiety z Geist Mono przeszły na Geist Sans; kafelki drugorzędne (ranga, ranking, punktacja) są płaskie;
      wiersz listy ma jedną odznakę statusu tylko dla LIVE, BO trafiło do opisu turnieju.
  LOGOWANIE (makieta): DB.user przełącza gość / zalogowany. ZASOBY: /api/logo/<slug>, /api/map/<slug>, w makiecie widać fallback.
-->

:root{
  /* Layout: bento 12 kolumn. Duży kafelek meczu (8) + dwa wąskie (4) obok, pod nimi trzy kafelki analizy (5/4/3),
     na dole lista (8) i ranking (4). Monochrom; kolor tylko dla live, HLTV i ARRMY. */
  --bg:#09090b; --tile:#111114; --side-ct:#4cc2ff; --side-t:#f0683c; --edge:rgba(255,255,255,.12); --edge-2:rgba(255,255,255,.24); --acc:#de9b35; --acc-ink:#1a1100;
  --ink:#fff; --mute:#b6b6c0; --dim:#787883; --faint:rgba(255,255,255,.06);
  --live:#ff3b30; --hltv:#2b6ea5; --hltv-ink:#8cc4f0; --arrmy:#eab308; --ok:#22c55e; --bad:#ef4444;
  --t:#de9b35; --ct:#de9b35;
  --sans:"Geist",system-ui,sans-serif; --mono:"Geist",system-ui,sans-serif; --num:"Geist Mono",ui-monospace,monospace; --display:"Saira Semi Condensed","Arial Narrow",sans-serif;
  --out:cubic-bezier(.23,1,.32,1); --r:20px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.55 var(--sans);font-family:"Geist",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:default}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:8px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.n,time,td{font-family:var(--num);font-variant-numeric:tabular-nums}
.label{font:500 12.5px/1.2 var(--sans);letter-spacing:0;text-transform:none;color:var(--dim)}

/* nav */
.nav{position:sticky;top:0;z-index:30;background:rgba(0,0,0,.78);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid var(--edge)}
.nav .in{display:flex;align-items:center;gap:2px;height:56px}
.brand{display:flex;align-items:center;gap:10px;margin-right:20px;font:700 18px/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.brand i{width:16px;height:16px;border-radius:4px;background:linear-gradient(#fff 50%,#dc143c 50%);box-shadow:0 0 0 1px var(--edge-2)}
.nav a.tab{height:32px;display:flex;align-items:center;padding:0 12px;border-radius:8px;color:var(--mute);font-size:14px;transition:color .15s,background .15s}
.nav a.tab:hover{color:var(--ink)} .nav a.tab[aria-current="page"]{color:var(--ink);background:var(--faint)}
.grow{flex:1}
.kbd{display:flex;align-items:center;gap:10px;height:34px;padding:0 8px 0 12px;border:1px solid var(--edge);border-radius:10px;color:var(--mute);font-size:13.5px;transition:border-color .15s,color .15s,transform .12s var(--out)}
.kbd:hover{border-color:var(--edge-2);color:var(--ink)} .kbd:active{transform:scale(.97)}
.kbd kbd{font:500 11px var(--mono);border:1px solid var(--edge);border-radius:5px;padding:1px 5px;color:var(--dim)}
.btn{height:34px;padding:0 14px;border-radius:10px;background:var(--acc);color:var(--acc-ink);font-weight:600;box-shadow:0 0 0 1px rgba(222,155,53,.5),0 8px 28px -8px rgba(222,155,53,.7);font-size:13.5px;display:inline-flex;align-items:center;gap:8px;margin-left:8px;transition:transform .12s var(--out),opacity .15s;white-space:nowrap}
.btn:hover{opacity:.9} .btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--edge);box-shadow:none;font-weight:500} .btn.ghost:hover{border-color:var(--edge-2);opacity:1}
.who{position:relative;margin-left:8px}
.who>button{display:flex;align-items:center;gap:10px;height:34px;padding:0 12px 0 4px;border:1px solid var(--edge);border-radius:999px;font-size:13.5px;transition:border-color .15s}
.who>button:hover{border-color:var(--edge-2)}
.who i{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#3f3f46,#18181b);display:grid;place-items:center;font:500 10px var(--mono);font-style:normal;box-shadow:inset 0 0 0 1px var(--edge-2)}
.who b{font:500 13px var(--mono);font-variant-numeric:tabular-nums}
.menu{position:absolute;right:0;top:42px;width:220px;padding:6px;border-radius:14px;background:#111113;border:1px solid var(--edge-2);box-shadow:0 20px 50px -12px #000}
.menu p{margin:0;padding:8px 10px 10px;font-size:12.5px;color:var(--mute);border-bottom:1px solid var(--edge)}
.menu button{width:100%;padding:8px 10px;border-radius:8px;font-size:13.5px;margin-top:4px} .menu button:hover{background:var(--faint)}

/* hero */
.hero{padding:96px 0 64px}
.hero h1{margin:0;font:700 clamp(44px,7.2vw,96px)/.92 var(--display);letter-spacing:-.01em;text-transform:uppercase;max-width:15ch;text-wrap:balance}
.hero p{margin:24px 0 32px;color:var(--mute);font-size:17px;line-height:1.5;max-width:44ch}
.hero .btn{margin:0;height:48px;padding:0 22px;border-radius:14px;font-size:15px}

/* bento */
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;padding-bottom:96px}
.tile{position:relative;border-radius:var(--r);border:1px solid var(--edge);background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.015) 34%,rgba(255,255,255,0)),var(--tile);padding:22px;min-width:0;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 30px 60px -40px #000;transition:border-color .2s}
.tile:hover{border-color:var(--edge-2)}
.th{display:flex;align-items:center;gap:10px;margin-bottom:20px;min-height:16px}
.th .r{margin-left:auto;display:flex;align-items:center;gap:8px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s5{grid-column:span 5}.s4{grid-column:span 4}.s3{grid-column:span 3}
.r2{grid-row:span 2}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}

.dot{width:7px;height:7px;border-radius:50%;background:var(--live);box-shadow:0 0 0 3px rgba(255,59,48,.25),0 0 12px rgba(255,59,48,.9);flex:none}
.src{font-size:10px;font-weight:500;letter-spacing:.08em;line-height:1;padding:4px 6px;border-radius:5px;flex:none}
.src.hltv{background:#2b6ea5;color:#fff}
.src.arrmy{background:#eab308;color:#0a0a0a}

/* now strip */
.now{padding:0;display:flex;align-items:stretch;height:48px;border-radius:14px}
.now .lead{display:flex;align-items:center;gap:10px;padding:0 18px;border-right:1px solid var(--edge);flex:none}
.now .items{display:flex;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.now .items::-webkit-scrollbar{display:none}
.now button{display:flex;align-items:center;gap:10px;padding:0 18px;border-right:1px solid var(--edge);white-space:nowrap;font:400 12.5px var(--mono);color:var(--mute);font-variant-numeric:tabular-nums;transition:background .15s,color .15s}
.now button:hover{background:var(--faint);color:var(--ink)}
.now button b{color:var(--ink);font-weight:500} .now button .t{color:var(--dim)}
.now button[aria-current="true"]{background:var(--faint);color:var(--ink)}

/* assets */
.asset{position:relative;width:var(--s);height:var(--s);flex:none;display:block}
.asset img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .25s var(--out)}
.fb{position:absolute;inset:0;overflow:hidden;border-radius:26%}
.fb b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.fb.team{background:linear-gradient(145deg,#3a3a40,#141416 48%,#27272b);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),inset 0 1px 0 rgba(255,255,255,.2)}
.fb.team b{font:600 calc(var(--s)*.33)/1 var(--sans);letter-spacing:-.03em;background:linear-gradient(175deg,#fff 20%,#8f8f98 55%,#ededf0 80%);-webkit-background-clip:text;background-clip:text;color:transparent}
.fb.team::after{content:"";position:absolute;top:-20%;bottom:-20%;width:38%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-18deg);transition:left .5s var(--out)}
.sheen:hover .fb.team::after{left:125%}
.fb.map{border-radius:6px;background:#18181b;box-shadow:inset 0 0 0 1px var(--edge-2)}
.fb.map b{font:500 calc(var(--s)*.34)/1 var(--mono);color:var(--mute)}
.pl{display:inline-flex;align-items:center;gap:6px;font:400 11.5px/1 var(--mono);color:var(--mute);white-space:nowrap}
.pl i{width:13px;height:9px;border-radius:2px;background:linear-gradient(#fff 50%,#dc143c 50%);box-shadow:0 0 0 1px rgba(255,255,255,.1)}

/* featured match */
.t-match{padding:0;display:flex;flex-direction:column;border-color:rgba(222,155,53,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 0 1px rgba(222,155,53,.12),0 0 90px -28px rgba(222,155,53,.6)}
.t-match:hover{border-color:rgba(222,155,53,.7)}
.t-match .amb{position:absolute;top:-20%;height:75%;width:55%;pointer-events:none;filter:blur(60px)}
.t-match .amb.a{left:-15%}.t-match .amb.b{right:-15%}
.t-match .th{position:relative;margin:0;padding:18px 22px;border-bottom:1px solid var(--edge);font-size:13px;color:var(--mute);white-space:nowrap}
.t-match .th .ev{color:var(--ink);overflow:hidden;text-overflow:ellipsis;min-width:0}
.pager button{width:28px;height:28px;border-radius:8px;border:1px solid var(--edge);transition:border-color .15s,transform .12s var(--out);text-align:center}
.pager button:hover{border-color:var(--edge-2)} .pager button:active{transform:scale(.94)}
.fgrid{position:relative;flex:1;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:16px;align-items:center;padding:44px 28px 40px}
.fside{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;min-width:0}
.fside h3{margin:6px 0 0;font:700 clamp(24px,2.7vw,34px)/1 var(--display);letter-spacing:.01em;text-transform:uppercase;overflow-wrap:anywhere}
.fside.lost h3{color:var(--dim)}
.form{display:flex;gap:4px}
.form i{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font:600 11px/1 "Geist Mono",monospace;font-style:normal;background:rgba(239,68,68,.2);color:#f87171;box-shadow:inset 0 0 0 1px rgba(239,68,68,.45)}
.form i.w{background:rgba(34,197,94,.2);color:#4ade80;box-shadow:inset 0 0 0 1px rgba(34,197,94,.45)}
.center{display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 8px}
.state{display:flex;align-items:center;gap:8px;white-space:nowrap}
.state.live{color:var(--live)}
.big{font:700 clamp(68px,8.6vw,112px)/.9 var(--display);letter-spacing:-.01em;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:10px}
.big span{color:var(--dim);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.map{font:400 11.5px var(--mono);font-variant-numeric:tabular-nums;border:1px solid var(--edge);border-radius:6px;padding:3px 7px;color:var(--mute);white-space:nowrap}
.map b{color:var(--ink);font-weight:500} .map.now-m{border-color:rgba(255,59,48,.6)}

<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

<script>
const {useState,useEffect,useRef,useMemo,useSyncExternalStore}=React;
const {motion,AnimatePresence,MotionConfig}=Motion;
const html=htm.bind((t,p,...c)=>{if(p&&'class' in p){p.className=p.class;delete p.class}return React.createElement(t,p,...c)});
const EASE=[.23,1,.32,1];

/* ============================ DANE (przykładowe) ============================
   Produkcja: DB.matches <- GET /api/matches, POOL <- GET /api/maps, savePicks() -> POST /api/picks, USER <- Twoja sesja. */
const ASSET_BASE='/api/';
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-');
const H=3600e3,MIN=60e3,T0=Date.now();
const POOL=[['Ancient','ANC'],['Anubis','ANB'],['Cache','CCH'],['Dust II','D2'],['Inferno','INF'],['Mirage','MIR'],['Nuke','NUK']]
  .map(([name,code])=>({name,code,icon:ASSET_BASE+'map/'+slug(name)+'.webp'}));
const mapOf=n=>POOL.find(p=>p.name===n)||{name:n,code:n.slice(0,3).toUpperCase(),icon:null};
const hash=s=>{let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))%9973;return h};
const T=(name,tag,hue,plNote,form,wr,rt)=>({name,tag,hue,plNote,form,wr,rt,kd:+(rt*1.02-.01).toFixed(2),adr:+(74+(rt-1)*70).toFixed(1),
  logo:ASSET_BASE+'logo/'+slug(name)+'.webp',maps:Object.fromEntries(POOL.map(p=>[p.name,30+hash(tag+p.code)%46]))});
const TEAMS={
  ba:T('Betclic Apogee','BA',352,'5 Polaków','WWLWW',61,1.08), sng:T('Sangal','SNG',28,null,'LWLLW',48,0.99),
  ib:T('Izako Boars','IB',18,'polski skład','WLWWL',55,1.03), fng:T('FANG ESPORT','FNG',196,'polski skład','WWWLW',58,1.05),
  tl:T('Team Liquid','TL',212,'siuhy','WLWWW',57,1.07), ast:T('Astralis','AST',2,null,'LWWLW',53,1.04),
  n9:T('9INE','9N',44,'5 Polaków','LWLWW',52,1.01), ecs:T('ECSTATIC','ECS',174,null,'WWWLW',59,1.06),
  mce:T('TEAM MCE','MCE',140,'polski skład','WWLWL',56,1.04), dmx:T('DimoniX Esports','DMX',322,'polski skład','LLWLW',44,0.96),
  esc:T('ESC Gaming','ESC',96,'5 Polaków','WLWLW',54,1.02), ihg:T('Illuminar Gaming','IHG',228,'5 Polaków','WWLLW',53,1.02),
  ano:T('Anonymo Esports','ANO',160,'5 Polaków','LLWLW',43,0.95), mnt:T('Monte','MNT',204,null,'WWWWL',63,1.09),
  usb:T('USB-C ESPORTS','USB',120,'polski skład','WLWWW',57,1.03), ot:T('overTIME','OT',40,'polski skład','LWLWL',47,0.98),
  pge:T('PGE Turów','PGE',210,'5 Polaków','WWLWW',55,1.03), nxs:T('Nexus','NXS',332,null,'WLLWW',51,1.00),
  hex:T('HEXAGONE','HEX',20,'polski skład','WWWLW',60,1.06), adv:T('Adversa Pro','ADV',70,'polski skład','LWLLW',45,0.97),
  ssh:T('Sashi','SSH',190,null,'LWWLL',49,0.99)
};
function mkLog(a,b,done){const arr=[...Array(a).fill('a'),...Array(b).fill('b')];let s=hash(a+'x'+b)+a*13;
  for(let i=arr.length-1;i>0;i--){s=(s*1103+12345)%2147483647;const j=s%(i+1);[arr[i],arr[j]]=[arr[j],arr[i]]}
  if(done){const w=a>b?'a':'b',k=arr.lastIndexOf(w);[arr[k],arr[arr.length-1]]=[arr[arr.length-1],arr[k]]}return arr}
const g=(name,a,b,done)=>({name,a,b,done:!!done,log:mkLog(a,b,done)});
const prob=o=>(1/o.a)/((1/o.a)+(1/o.b));
const M=(id,src,event,stage,bo,dt,status,a,b,oa,ob,crowd,h2h,maps,series)=>{const m={id,src,event,stage,bo,start:T0+dt,status,a:TEAMS[a],b:TEAMS[b],
  odds:{a:oa,b:ob},prev:{a:oa,b:ob},base:{a:oa,b:ob},crowd,h2h,maps:maps||[],series:series||{a:0,b:0},hist:[]};
  if(status==='live'){const end=prob(m.odds);let v=end-((hash(id)%20)-10)/100;for(let i=0;i<18;i++){v+=(end-v)*.18+(((hash(id+i)%11)-5)/100);m.hist.push(Math.min(.95,Math.max(.05,v)))}m.hist.push(end)}
  return m};
const DB={
  matches:[
    M('m1','hltv','CCT Europe Series','Ćwierćfinał',3,-58*MIN,'live','ba','sng',1.42,2.75,71,[3,1],[g('Mirage',13,9,true),g('Ancient',7,5)],{a:1,b:0}),
    M('m2','arrmy','ARRMY CUP','Półfinał',1,-34*MIN,'live','ib','fng',1.95,1.80,58,[1,1],[g('Inferno',10,11)]),
    M('m3','hltv','ESL Pro League','Grupa B',3,42*MIN,'upcoming','tl','ast',1.72,2.08,63,[4,3]),
    M('m4','hltv','CCT Europe Series','Ćwierćfinał',3,2.2*H,'upcoming','n9','ecs',2.25,1.60,44,[1,2]),
    M('m5','arrmy','ARRMY Liga','Kolejka 6',1,3.5*H,'upcoming','mce','dmx',1.55,2.35,66,[2,0]),
    M('m6','hltv','Polska Liga Esportowa','Finał',3,5*H,'upcoming','esc','ihg',1.88,1.88,51,[3,3]),
    M('m7','hltv','European Pro League','Faza grupowa',3,22*H,'upcoming','ano','mnt',2.60,1.47,35,[0,2]),
    M('m8','arrmy','ARRMY Liga','Kolejka 6',1,26*H,'upcoming','usb','ot',1.70,2.10,60,[1,0]),
    M('m9','hltv','European Pro League','Faza grupowa',3,-3.4*H,'finished','pge','nxs',1.85,1.92,55,[2,1],[g('Nuke',13,10,true),g('Dust II',8,13,true),g('Anubis',13,6,true)],{a:2,b:1}),
    M('m10','arrmy','ARRMY CUP','Ćwierćfinał',1,-20*H,'finished','hex','adv',1.50,2.45,69,[2,0],[g('Mirage',13,8,true)],{a:1,b:0}),
    M('m11','hltv','CCT Europe Series','1/8 finału',3,-23*H,'finished','n9','ssh',1.65,2.15,62,[1,1],[g('Ancient',13,11,true),g('Inferno',13,7,true)],{a:2,b:0})
  ],
  picks:(()=>{try{const r=localStorage.getItem('bct4-picks');if(r)return JSON.parse(r)}catch(e){}return {m9:{winner:'a',exact:'2-1',odds:1.85},m10:{winner:'b',exact:null,odds:2.45},m4:{winner:'a',exact:null,odds:2.25}}})(),
  auto:true,last:Date.now(),toast:null,v:0
};
const USER={name:'Ty',basePoints:312};
const RIVALS=[['kubaa_awp',468,71,19,6],['Wiktoria.gg',441,68,17,3],['mlody_igl',420,66,18,2],['Szymek2k',398,64,15,4],['dziku',377,65,12,1],['NataliaCT',351,61,14,5],
  ['b4rtek',329,60,11,0],['olo_entry',318,58,12,2],['Majkel',296,57,10,1],['zuzia_smoke',271,55,9,0],['Tomo',240,52,8,2],['Fifi',214,50,6,0]];
const PTS={win:10,dog:5,exact:15};
const TIERS=[[0,'Rekrut'],[150,'Rifler'],[300,'Entry'],[450,'AWPer'],[600,'IGL']];
const tierOf=p=>{let i=0;TIERS.forEach((t,k)=>{if(p>=t[0])i=k});return i};

const subs=new Set(); const emit=()=>{DB.v++;subs.forEach(f=>f())};
const useStore=()=>useSyncExternalStore(f=>{subs.add(f);return()=>subs.delete(f)},()=>DB.v);
const savePicks=()=>{try{localStorage.setItem('bct4-picks',JSON.stringify(DB.picks))}catch(e){}};
let tt; const toast=msg=>{DB.toast=msg;clearTimeout(tt);tt=setTimeout(()=>{DB.toast=null;emit()},3200);emit()};

const f2=n=>n.toFixed(2), need=m=>Math.ceil(m.bo/2);
const winnerOf=m=>m.status==='finished'?(m.series.a>m.series.b?'a':'b'):null;
const exactOf=m=>{if(m.bo===1){const x=m.maps[0];return Math.max(x.a,x.b)>13?'OT':x.a+'-'+x.b}return m.series.a+'-'+m.series.b};
function scorePick(m,p){if(!p||m.status!=='finished')return null;if(p.winner!==winnerOf(m))return {pts:0};
  let pts=PTS.win;if(p.odds>=2)pts+=PTS.dog;const ex=!!p.exact&&p.exact===exactOf(m);if(ex)pts+=PTS.exact;return {pts,ex}}
const potential=(m,p)=>PTS.win+((m.status==='upcoming'?m.odds[p.winner]:p.odds)>=2?PTS.dog:0)+(p.exact?PTS.exact:0);
function myStats(){let pts=USER.basePoints,hit=0,done=0,ex=0,week=0;
  for(const m of DB.matches){const r=scorePick(m,DB.picks[m.id]);if(r){done++;pts+=r.pts;week+=r.pts;if(r.pts)hit++;if(r.ex)ex++}}
  return {pts,week,acc:Math.round((41+hit)/(66+done)*100),exact:13+ex,pending:DB.matches.filter(m=>m.status!=='finished'&&DB.picks[m.id]).length}}
function board(wk){const me=myStats();
  const rows=RIVALS.map(([n,p,acc,ex,st],i)=>({n,sp:p,p:wk?Math.round(p*.11+((i*7)%5)*4):p,acc,ex:wk?Math.round(ex/5):ex,st}));
  rows.push({n:USER.name,sp:me.pts,p:wk?me.week:me.pts,acc:me.acc,ex:wk?Math.round(me.exact/5):me.exact,st:1,you:true});
  rows.sort((x,y)=>y.p-x.p);rows.forEach((r,i)=>r.rank=i+1);return rows}
function pick(m,s){if(m.status!=='upcoming')return;if(!DB.user){DB.login=true;emit();return}const cur=DB.picks[m.id];
  if(cur&&cur.winner===s){delete DB.picks[m.id];toast('Typ usunięty')}
  else{DB.picks[m.id]={winner:s,exact:null,odds:m.odds[s]};toast('Zapisano: '+m[s].name+' · do '+potential(m,DB.picks[m.id])+' pkt')}
  savePicks();emit()}
const clock=t=>new Date(t).toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'});
const dayKey=t=>{const d=new Date(t),n=new Date();return Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(n.getFullYear(),n.getMonth(),n.getDate()))/864e5)};
function cd(t){const d=t-Date.now();if(d<=0)return '00:00';const s=Math.floor(d/1e3),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;
  return h?h+' h '+String(m).padStart(2,'0')+' min':String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0')}

/* symulacja odświeżania; produkcja: polling albo SSE */
function reprice(m){const p0=prob(m.base),x=m.maps[m.maps.length-1]||{a:0,b:0};
  const p=Math.min(.95,Math.max(.05,p0+(m.series.a-m.series.b)*.2+(x.a-x.b)*.022));
  m.prev={...m.odds};m.odds={a:Math.max(1.02,+(.94/p).toFixed(2)),b:Math.max(1.02,+(.94/(1-p)).toFixed(2))};m.hist.push(prob(m.odds));if(m.hist.length>40)m.hist.shift()}
function tick(){const now=Date.now();
  for(const m of DB.matches){
    if(m.status==='upcoming'){
      if(m.start<=now){m.status='live';m.maps=[g(nextMap(m),0,0)];m.hist=[prob(m.odds)];toast('Start: '+m.a.name+' vs '+m.b.name+'. Typy zamknięte.')}
      else if(Math.random()<.25){m.prev={...m.odds};const d=(Math.random()<.5?-1:1)*.02;m.odds={a:+Math.max(1.05,m.odds.a+d).toFixed(2),b:+Math.max(1.05,m.odds.b-d).toFixed(2)};m.base={...m.odds}}
      continue}
    if(m.status!=='live'||Math.random()>.6)continue;
    const x=m.maps[m.maps.length-1],s=Math.random()<prob(m.base)?'a':'b';x[s]++;x.log.push(s);
    if(x[s]>=((x.a>=12&&x.b>=12)?16:13)){x.done=true;m.series[s]++;
      if(m.bo===1||m.series[s]>=need(m)){m.status='finished';const r=scorePick(m,DB.picks[m.id]);
        toast('Koniec: '+m[s].name+' wygrywa'+(r?(r.pts?' · +'+r.pts+' pkt':' · 0 pkt'):''))}
      else m.maps.push(g(nextMap(m),0,0))}
    if(m.status==='live')reprice(m)}
  DB.last=now;emit()}
setInterval(()=>{if(DB.auto&&!document.hidden)tick()},5000);
setInterval(emit,1000);


const assetCache=new Map();
function Asset({url,code,hue,size=32,kind='team',label}){
  const [st,setSt]=useState(()=>assetCache.get(url)||(url?'load':'err'));
  useEffect(()=>{if(st!=='load')return;const t=setTimeout(()=>{assetCache.set(url,'err');setSt('err')},4000);return()=>clearTimeout(t)},[st,url]);
  const done=s=>()=>{assetCache.set(url,s);setSt(s)};
  return html`<span class="asset" style=${{'--s':size+'px','--h':hue||0}} role="img" aria-label=${label}>
    ${st!=='ok'&&html`<span class=${'fb '+kind}><b>${code}</b></span>`}
    ${st!=='err'&&html`<img src=${url} alt="" width=${size} height=${size} loading="lazy" decoding="async" referrerPolicy="no-referrer" onLoad=${done('ok')} onError=${done('err')} style=${{opacity:st==='ok'?1:0}}/>`}
  </span>`;
}
const Logo=({t,size})=>html`<${Asset} url=${t.logo} code=${t.tag} hue=${t.hue} size=${size} label=${'Logo '+t.name}/>`;
const MapIcon=({name,size=26})=>{const p=mapOf(name);return html`<${Asset} url=${p.icon} code=${p.code} hue=${hash(name)%360} size=${size} kind="map" label=${'Mapa '+name}/>`};
const Pl=({t})=>t.plNote?html`<span class="pl"><i></i>${t.plNote}</span>`:null;
const Bar=({w,c})=>html`<${motion.i} initial=${false} animate=${{width:w+'%'}} transition=${{duration:.28,ease:EASE}} style=${{background:c}}/>`;
function Compare({label,a,b,fmt}){
  const max=Math.max(a,b)||1,lead=a===b?null:a>b?'a':'b';
  return html`<div class="cmp-r"><span class="v" style=${{color:lead==='a'?'var(--ink)':'var(--mute)'}}>${fmt(a)}</span>
    <div class="mid"><small class="label">${label}</small><div class="bars">
      <div><${Bar} w=${a/max*100} c=${lead==='a'?'var(--t)':'rgba(255,255,255,.34)'}/></div>
      <div><${Bar} w=${b/max*100} c=${lead==='b'?'var(--ct)':'rgba(255,255,255,.34)'}/></div>
    </div></div><span class="v" style=${{color:lead==='b'?'var(--ink)':'var(--mute)'}}>${fmt(b)}</span></div>`;
}
function Spark({hist}){
  const W=240,Hh=44,n=hist.length,x=i=>n>1?i/(n-1)*W:W,y=v=>Hh-4-v*(Hh-8);
  const pts=hist.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ');
  return html`<svg viewBox=${'0 0 '+W+' '+Hh} preserveAspectRatio="none" aria-hidden="true">
    <line x1="0" x2=${W} y1=${y(.5)} y2=${y(.5)} stroke="rgba(255,255,255,.14)" stroke-dasharray="2 4" vector-effect="non-scaling-stroke"/>
    <polygon points=${'0,'+Hh+' '+pts+' '+W+','+Hh} fill="rgba(222,155,53,.14)"/>
    <polyline points=${pts} fill="none" stroke="#de9b35" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
  </svg>`;
}
function CommandPalette({onClose,apply}){
  const [q,setQ]=useState(''),[i,setI]=useState(0),ref=useRef();
  useEffect(()=>{ref.current&&ref.current.focus()},[]);
  const all=useMemo(()=>{const teams=new Map(),events=new Set();
    DB.matches.forEach(m=>{teams.set(m.a.name,m.a);teams.set(m.b.name,m.b);events.add(m.event)});
    return [
      {g:'Filtry',t:'Tylko mecze na żywo',k:'live',f:{status:'live'}},{g:'Filtry',t:'Tylko nadchodzące',k:'upcoming',f:{status:'upcoming'}},
      {g:'Filtry',t:'Tylko zakończone',k:'finished',f:{status:'finished'}},{g:'Filtry',t:'Mecze bez mojego typu',k:'bez typu',f:{unpicked:true,status:'upcoming'}},
      {g:'Filtry',t:'Źródło: tylko HLTV',k:'hltv',f:{hltv:true,arrmy:false}},{g:'Filtry',t:'Źródło: tylko ARRMY',k:'arrmy',f:{hltv:false,arrmy:true}},
      {g:'Filtry',t:'Wyczyść wszystkie filtry',k:'reset',f:{status:'all',hltv:true,arrmy:true,team:null,event:null,map:null,unpicked:false}},
      ...[...teams.values()].map(t=>({g:'Drużyny',t:t.name,k:t.tag,f:{team:t.name}})),
      ...[...events].map(e=>({g:'Turnieje',t:e,k:'turniej',f:{event:e}})),
      ...POOL.map(p=>({g:'Mapy',t:'Mecze na mapie '+p.name,k:p.code,f:{map:p.name}}))]},[]);
  const res=all.filter(x=>(x.t+' '+x.k).toLowerCase().includes(q.trim().toLowerCase())),sel=Math.min(i,res.length-1);
  const key=e=>{if(e.key==='ArrowDown'){e.preventDefault();setI(Math.min(sel+1,res.length-1))}else if(e.key==='ArrowUp'){e.preventDefault();setI(Math.max(sel-1,0))}
    else if(e.key==='Enter'&&res[sel]){apply(res[sel].f);onClose()}};
  let lastG='';
  return html`<div class="scrim" onMouseDown=${e=>{if(e.target===e.currentTarget)onClose()}}>
    <div class="cmd" role="dialog" aria-modal="true" aria-label="Szukaj i filtruj">
      <input id="cmd-q" ref=${ref} value=${q} onInput=${e=>{setQ(e.target.value);setI(0)}} onKeyDown=${key} placeholder="Drużyna, turniej, mapa albo filtr" autoComplete="off" aria-label="Szukaj"/>
      <div class="res" role="listbox">${res.length?res.map((x,n)=>{const head=x.g!==lastG;lastG=x.g;return html`<${React.Fragment} key=${x.g+x.t}>
        ${head&&html`<div class="grp label">${x.g}</div>`}
        <button class="it" role="option" aria-selected=${n===sel} onMouseEnter=${()=>setI(n)} onClick=${()=>{apply(x.f);onClose()}}>${x.t}<small>${x.g==='Drużyny'||x.g==='Mapy'?x.k:''}</small></button><//>`})
        :html`<div class="nores">Brak wyników dla „${q}”. Wpisz nazwę drużyny, turnieju albo mapy.</div>`}</div>
      <div class="hint"><span>↑↓ wybór</span><span>Enter zastosuj</span><span>Esc zamknij</span></div>
    </div></div>`;
}

/* ---- makieta logowania ---- */
DB.user=(()=>{try{return localStorage.getItem('bct4-user')==='1'}catch(e){return false}})();
DB.login=false;
USER.name='demo_gracz';
const openLogin=()=>{DB.login=true;emit()};
const setUser=v=>{DB.user=v;DB.login=false;try{localStorage.setItem('bct4-user',v?'1':'0')}catch(e){}toast(v?'Zalogowano jako '+USER.name+' (makieta)':'Wylogowano');};
const P=id=>DB.user?DB.picks[id]:null;

const Src=({s})=>html`<span class=${'src '+s}>${s==='hltv'?'HLTV':'ARRMY'}</span>`;
function Odd({m,s}){
  const p=P(m.id),locked=m.status!=='upcoming',mine=!!p&&p.winner===s,w=winnerOf(m);
  const k=locked&&mine?p.odds:m.odds[s],d=m.odds[s]-m.prev[s];

function mkVeto(m){
  const played=m.maps.map(x=>x.name);let left=POOL.map(p=>p.name);
  const take=n=>{left=left.filter(x=>x!==n);return n};
  const best=(t,o)=>left.slice().sort((x,y)=>(t.maps[y]-o.maps[y])-(t.maps[x]-o.maps[x]))[0];
  const ban=s=>({s,act:'ban',map:take(best(m[s==='a'?'b':'a'],m[s]))}),out=[];
  if(m.bo===1){const dec=played[0]||null;if(dec)take(dec);
    for(const s of ['a','b','a','b','a','b'])out.push(ban(s));
    out.push({s:null,act:'decider',map:dec||take(left[0])});return out}
  const [pA,pB,dec]=played;[pA,pB,dec].filter(Boolean).forEach(take);
  out.push(ban('a'),ban('b'));
  out.push({s:'a',act:'pick',map:pA||take(best(m.a,m.b))},{s:'b',act:'pick',map:pB||take(best(m.b,m.a))});
  out.push(ban('a'),ban('b'));
  out.push({s:null,act:'decider',map:dec||take(left[0])});return out;
}

}
function RankTile(){
  const lb=board(false).filter(r=>DB.user||!r.you).map((r,i)=>({...r,rank:i+1})),you=lb.find(r=>r.you);
  return html`<section class="tile flat" aria-label="Ranking sezonu"><div class="th"><span class="label">Ranking sezonu</span><a class="r lnk" href="#ranking">Cały ranking</a></div>
    <ol class="mini">${lb.slice(0,6).map(r=>html`<li key=${r.n} class=${r.you?'you':''}><span>${String(r.rank).padStart(2,'0')}</span><span>${r.n}</span><b>${r.p}</b></li>`)}
      ${you&&you.rank>6&&html`<li class="you"><span>${String(you.rank).padStart(2,'0')}</span><span>${you.n}</span><b>${you.p}</b></li>`}</ol></section>`;
}
const RulesTile=()=>html`<section class="tile flat" aria-label="Punktacja"><div class="th"><span class="label">Punktacja</span><a class="r lnk" href="#zasady">Zasady</a></div>
  <ul class="rules"><li>Trafiony zwycięzca<b>+${PTS.win}</b></li><li>Underdog, kurs od 2.00<b>+${PTS.dog}</b></li><li>Dokładny wynik<b>+${PTS.exact}</b></li></ul></section>`;

function Matches({f,setF,focus,setFocus,openCmd}){
  const all=DB.matches,top=useRef();
  const order=[...all].sort((a,b)=>{const r={live:0,upcoming:1,finished:2};return r[a.status]-r[b.status]||(a.status==='finished'?b.start-a.start:a.start-b.start)});
  const fi=Math.max(0,order.findIndex(m=>m.id===focus)),fm=order[fi],step=d=>setFocus(order[(fi+d+order.length)%order.length].id);
  return html`
  <section class="hero">
    <h1>Typuj mecze CS2, w których grają Polacy.</h1>
    <p>Wyniki i kursy z HLTV i ARRMY odświeżane co 5 sekund. Typujesz za darmo, na punkty.</p>
    <button class="btn" onClick=${()=>{const n=order.find(m=>m.status==='upcoming');if(n)setFocus(n.id);top.current&&top.current.scrollIntoView({behavior:'smooth',block:'start'})}}>Typuj najbliższy mecz</button>
  </section>
  <div class="bento" ref=${top} style=${{scrollMarginTop:72}}>
    <${NowStrip} focus=${fm.id} setFocus=${setFocus}/>
    <${Featured} key=${fm.id} m=${fm} index=${fi} total=${order.length} onStep=${step}/>
    <${ProbTile} m=${fm}/>
    <${RoundsTile} m=${fm}/>
    <${VetoTile} m=${fm}/>
    <${StatsTile} m=${fm}/>
    <${MapsTile} m=${fm}/>
    <${RosterTile} m=${fm}/>
    <${MeTile}/>
    <${ListTile} f=${f} setF=${setF} focusId=${fm.id} openCmd=${openCmd} onFocus=${id=>setFocus(id)} onOpen=${()=>top.current&&top.current.scrollIntoView({behavior:'smooth',block:'start'})}/>
    <div class="col s4"><${RankTile}/><${RulesTile}/></div>
  </div>`;
}
function Ranking(){
  const [wk,setWk]=useState(false),rows=board(wk).filter(r=>DB.user||!r.you).map((r,i)=>({...r,rank:i+1}));
  return html`<div class="page-h"><div><span class="label">Ranking · ${rows.length} graczy</span><h2>Ranking</h2></div><span class="grow"></span>
    <div class="tabs" role="group" aria-label="Okres">${[[false,'Sezon'],[true,'Ten tydzień']].map(([k,l])=>html`<button key=${l} aria-pressed=${wk===k} onClick=${()=>setWk(k)}>
      ${wk===k&&html`<${motion.span} layoutId="lb-pill" class="pill" transition=${{duration:.22,ease:EASE}}/>`}<span>${l}</span></button>`)}</div></div>
  <div class="tile tblw"><table><thead><tr><th>#</th><th>Gracz</th><th>Ranga</th><th>Trafność</th><th>Dokładne</th><th>Seria</th><th>Punkty</th></tr></thead><tbody>
    ${rows.map(r=>html`<tr key=${r.n} class=${r.you?'you':''}><td>${String(r.rank).padStart(2,'0')}</td><td>${r.n}</td><td>${TIERS[tierOf(r.sp)][1]}</td><td>${r.acc}%</td><td>${r.ex}</td><td>${r.st||'0'}</td><td>${r.p}</td></tr>`)}
  </tbody></table></div>`;
}
function Rules(){
  return html`<div class="page-h"><div><span class="label">Zasady · punktacja</span><h2>Zasady</h2></div><p>Typowanie jest darmowe. Punkty liczą się wyłącznie do rankingu i rangi.</p></div>
  <div class="c3">
    <div class="tile rule"><b class="k">+${PTS.win}</b><h4>Trafiony zwycięzca</h4><p>Wskazujesz drużynę, która wygra mecz.</p></div>
    <div class="tile rule"><b class="k">+${PTS.dog}</b><h4>Underdog</h4><p>Twoja drużyna miała kurs 2.00 lub wyższy w chwili zapisania typu.</p></div>
    <div class="tile rule"><b class="k">+${PTS.exact}</b><h4>Dokładny wynik</h4><p>BO3 i BO5: wynik w mapach. BO1: wynik w rundach. Liczy się tylko przy trafionym zwycięzcy.</p></div>
  </div>
  <div class="c2">
    <div class="tile rule"><h4>Rangi</h4><p>${TIERS.map(t=>t[1]+' od '+t[0]+' pkt').join(', ')}.</p></div>
    <div class="tile rule"><h4>Które mecze są na liście</h4><p>Te, w których w składzie jest co najmniej jeden Polak. Biało-czerwony znacznik stoi przy drużynie z Polakami.</p></div>
    <div class="tile rule"><h4>Zamknięcie typów</h4><p>O godzinie startu meczu. Wcześniej typ można zmieniać bez limitu. Do bonusu liczy się kurs z ostatniej zmiany.</p></div>
    <div class="tile rule"><h4>Predykcja i kursy</h4><p>Predykcja to szansa wyliczona z kursów po zdjęciu marży. Na stronie nie ma zakładów na pieniądze.</p></div>
  </div>`;
}
function LoginModal(){
  return html`<${motion.div} class="scrim mid" initial=${{opacity:0}} animate=${{opacity:1}} exit=${{opacity:0}} transition=${{duration:.18}} onMouseDown=${e=>{if(e.target===e.currentTarget){DB.login=false;emit()}}}>
    <${motion.div} class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-t" initial=${{opacity:0,scale:.96,y:8}} animate=${{opacity:1,scale:1,y:0}} exit=${{opacity:0,scale:.98}} transition=${{duration:.22,ease:EASE}}>
      <span class="label">Tryb podglądu</span>
      <h3 id="dlg-t">Logowanie nie jest jeszcze podłączone</h3>
      <p>W gotowej wersji ten przycisk otworzy Twój system logowania, na przykład przez Steam. W makiecie możesz wejść jako przykładowy gracz i zobaczyć stronę po zalogowaniu.</p>
      <div class="acts"><button class="btn" autoFocus onClick=${()=>setUser(true)}>Wejdź jako przykładowy gracz</button>
        <button class="btn ghost" onClick=${()=>{DB.login=false;emit()}}>Zostań gościem</button></div>
    <//><//>`;
}
const routeOf=()=>{const h=location.hash.slice(1);return ['mecze','ranking','zasady'].includes(h)?h:'mecze'};
function App(){
  useStore();
  const [view,setView]=useState(routeOf),[cmd,setCmd]=useState(false),[focus,setFocus]=useState('m1'),[menu,setMenu]=useState(false);
  const [f,setF]=useState({status:'all',hltv:true,arrmy:true,team:null,event:null,map:null,unpicked:false,sort:'time'});
  useEffect(()=>{const on=()=>{setView(routeOf());window.scrollTo(0,0)};window.addEventListener('hashchange',on);
    const k=e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();setCmd(c=>!c)}else if(e.key==='Escape'){setCmd(false);setMenu(false);if(DB.login){DB.login=false;emit()}}};
    window.addEventListener('keydown',k);return()=>{window.removeEventListener('hashchange',on);window.removeEventListener('keydown',k)}},[]);
  const openCmd=()=>{if(view!=='mecze')location.hash='mecze';setCmd(true)};
  return html`<${MotionConfig} reducedMotion="user">
    <header class="nav"><div class="wrap in">
      <a class="brand" href="#mecze" aria-label="Biało-Czerwoni, strona główna"><i></i><span>Biało-Czerwoni</span></a>
      ${[['mecze','Mecze'],['ranking','Ranking'],['zasady','Zasady']].map(([k,l])=>html`<a key=${k} class="tab" href=${'#'+k} aria-current=${view===k?'page':null}>${l}</a>`)}
      <span class="grow"></span>
      <button class="kbd" onClick=${openCmd} aria-label="Szukaj drużyny, turnieju lub mapy"><span>Szukaj</span><kbd>Ctrl K</kbd></button>
      ${DB.user?html`<div class="who"><button onClick=${()=>setMenu(!menu)} aria-expanded=${menu} aria-label="Konto"><i>DG</i><span>${USER.name}</span><b>${myStats().pts}</b></button>
          ${menu&&html`<div class="menu"><p>Przykładowy profil. Dane konta przyjdą z Twojego systemu logowania.</p><button onClick=${()=>{setMenu(false);setUser(false)}}>Wyloguj</button></div>`}</div>`
        :html`<button class="btn" onClick=${openLogin}>Zaloguj się</button>`}
    </div></header>
    <main class="wrap">${view==='ranking'?html`<${Ranking}/>`:view==='zasady'?html`<${Rules}/>`:html`<${Matches} f=${f} setF=${setF} focus=${focus} setFocus=${setFocus} openCmd=${openCmd}/>`}</main>
    <footer><div class="wrap">Makieta. Mecze, wyniki, kursy, statystyki i ranking są przykładowe i symulowane w przeglądarce. Logowanie działa w trybie podglądu.</div></footer>
    ${cmd&&html`<${CommandPalette} onClose=${()=>setCmd(false)} apply=${x=>setF(p=>({...p,...x}))}/>`}
    <${AnimatePresence}>${DB.login&&html`<${LoginModal} key="login"/>`}<//>
    <${AnimatePresence}>${DB.toast&&html`<${motion.div} key=${DB.toast} class="toast" role="status" initial=${{opacity:0,y:12,x:'-50%'}} animate=${{opacity:1,y:0,x:'-50%'}} exit=${{opacity:0,x:'-50%'}} transition=${{duration:.25,ease:EASE}}>${DB.toast}<//>`}<//>
  <//>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
